<style>

}

body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:var(--gray-50);color:var(--gray-800);line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:40px}

.modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.dot-grid{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:14px}
.dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.dot.ok{background:var(--green-500)}.dot.ng{background:var(--red-500)}.dot.skip{background:var(--gray-400)}

.psg-in-bank{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius-xs);padding:10px;margin-top:6px;font-size:12px;line-height:1.8;max-height:150px;overflow-y:auto;white-space:pre-wrap}

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay">
<div class="modal-box">
<h3 id="modalTitle">Confirm</h3>
<p id="modalMsg">Are you sure?</p>
<div class="modal-btns">
<button class="btn btn-outline" onclick="closeModal()">Cancel</button>
<button class="btn btn-danger" id="modalConfirm">Confirm</button>
</div>
</div>
</div>
<script>
// ===== CLOUD SAVE URL =====
const CLOUD_URL = 'https://script.google.com/macros/s/AKfycbzRnKagiOJWQNMtWO7U-QmFhB7TXg-agE-GNeHHLYU3WzLlBPq7vL53asQYDC5qgU1aLw/exec';
// 貼你嘅Google Apps Script URL喺上面引號入面

function showModal(title,msg,confirmText,onConfirm){
document.getElementById('modalTitle').textContent=title;
document.getElementById('modalMsg').textContent=msg;
const btn=document.getElementById('modalConfirm');
btn.textContent=confirmText||'Confirm';
btn.onclick=function(){closeModal();if(onConfirm)onConfirm();};
document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show');}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function nowStr(){const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes());}
function p2(n){return String(n).padStart(2,'0');}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function fmtB(b){return b<1024?b+'B':b<1048576?(b/1024).toFixed(1)+'KB':(b/1048576).toFixed(1)+'MB';}
function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5);}
function qKey(q){return(q.stem||'').substring(0,60)+'##'+(q.options?q.options[0]:'')}
function optLabel(i){return'ABCDE'[i]||String(i);}

const PARTS_META=[

const PASSAGE_P1=`The notion that technology invariably leads to progress is one that has been largely unchallenged in public discourse for decades. From the industrial revolution onwards, each wave of innovation has been greeted with optimism, and those who expressed reservations were often dismissed as Luddites or reactionaries. Yet a more nuanced examination of the relationship between technological advancement and human wellbeing reveals a far more complex picture.\n\nConsider the impact of social media on democratic processes. While these platforms were initially celebrated as tools for democratisation — enabling citizens to organise, share information, and hold power to account — their capacity for spreading misinformation has proved equally formidable. The algorithms that determine what users see are designed not to inform but to engage, and outrage, it transpires, is considerably more engaging than nuance.\n\nThis is not to suggest that we should reject technological innovation wholesale. Rather, the argument is for a more deliberate and critical approach to adoption. The question should never be simply whether a new technology can be deployed, but whether it should be, and under what conditions. History offers numerous examples of innovations that were technically feasible but socially destructive — from leaded petrol to asbestos insulation.\n\nUltimately, the measure of any technology should be its contribution to human flourishing in its broadest sense. This requires that we move beyond simplistic metrics of economic growth or efficiency and consider the full spectrum of effects on social cohesion, mental health, equality of opportunity, and environmental sustainability. Technology, after all, is a means to an end, not an end in itself.`;

const PASSAGE_P4=`Passage A:\n\n(1) The city council has announced plans to convert three downtown parking lots into public green spaces. (2) The decision follows years of advocacy by environmental groups. (3) Having conducted extensive research into the benefits of urban greenery the council believes the investment will yield significant returns. (4) Studies show that access to green spaces reduces stress and promotes physical activity. (5) Property values near parks tend to increase by up to 20 percent. (6) However, some business owners have expressed concerns. (7) They worry that reduced parking will drive customers to suburban shopping centres. (8) The council has promised to address these concerns. (9) A new multi-storey car park will be built on the edge of the downtown area. (10) Shuttle buses will connect it to the main shopping streets.\n\n---\n\nPassage B:\n\n(1) Remote working has become increasingly common since the pandemic. (2) Many employees report higher job satisfaction when working from home. (3) Employers benefit from reduced overhead costs. (4) Despite these advantages, remote working is not without its challenges. (5) Some workers struggle with isolation and find it difficult to maintain boundaries between work and personal life. (6) Communication between team members can also suffer. (7) Misunderstandings that would be quickly resolved in person may escalate when conducted through email or messaging. (8) For this reason many organisations have adopted hybrid models. (9) Employees typically spend two or three days in the office and the remainder at home. (10) This approach attempts to balance flexibility with the benefits of face-to-face collaboration.`;

});

// ===== CLOUD SAVE FUNCTIONS =====
function cloudSave(){
if(!CLOUD_URL){toast('未設定Cloud URL');return}
const data=JSON.stringify(buildSave());
const statusEl=document.getElementById('cloudStatus');
if(statusEl){statusEl.className='cloud-status show loading';statusEl.textContent='⏳ 儲存中...';}
fetch(CLOUD_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:data})
.then(()=>{
if(statusEl){statusEl.className='cloud-status show ok';statusEl.textContent='✅ 已儲存到Google Drive! '+nowStr();}
toast('☁️ Cloud saved!');
})
.catch(err=>{
if(statusEl){statusEl.className='cloud-status show err';statusEl.textContent='❌ 儲存失敗: '+err.message;}
toast('Save failed');
});
}

function cloudLoad(){
if(!CLOUD_URL){toast('未設定Cloud URL');return}
const statusEl=document.getElementById('cloudStatus');
if(statusEl){statusEl.className='cloud-status show loading';statusEl.textContent='⏳ 讀取中...';}
fetch(CLOUD_URL)
.then(r=>r.text())
.then(txt=>{
if(!txt||txt==='NOT_FOUND'||txt.trim()===''){
if(statusEl){statusEl.className='cloud-status show err';statusEl.textContent='⚠️ 雲端無存檔';}
toast('No cloud save found');return;
}
let d;try{d=JSON.parse(txt)}catch(e){
if(statusEl){statusEl.className='cloud-status show err';statusEl.textContent='❌ 資料格式錯誤';}
toast('Parse error');return;
}
applyLoad(d);
if(statusEl){statusEl.className='cloud-status show ok';statusEl.textContent='✅ 已從雲端載入! '+nowStr();}
toast('☁️ Cloud loaded!');render();
})
.catch(err=>{
if(statusEl){statusEl.className='cloud-status show err';statusEl.textContent='❌ 讀取失敗: '+err.message;}
toast('Load failed');
});
}

function applyLoad(d){
if(d.wb)WB=d.wb;if(d.ub)UB=d.ub;if(d.hist)HIST=d.hist;if(d.cq)CQ=d.cq;
if(d.psg1)PSG1=d.psg1;if(d.psg4)PSG4=d.psg4;
if(d.imp)IMP=d.imp;if(d.pc!==undefined)PC=d.pc;if(d.psgHist)PSG_HIST=d.psgHist;
for(let i=1;i<=4;i++){if(!WB[i])WB[i]=[];if(!UB[i])UB[i]=[]}
}

function submitQ(){
tStop();const qs=S.qs;const submitTime=nowStr();
let cor=0,added=0,removed=0,uncAdded=0;
const psgLabel=submitTime;
const breakdown={};PARTS_META.forEach(p=>{breakdown[p.id]=0});

qs.forEach((q,i)=>{
const pid=q._part||S.part||1;if(pid<1||pid>4)return;
const key=qKey(q);
const bi=WB[pid].findIndex(e=>qKey(e)===key);
if(S.ans[i]===q.answer){
cor++;if(breakdown[pid]!==undefined)breakdown[pid]++;
if(bi>=0){WB[pid].splice(bi,1);removed++}
}else if(S.ans[i]!==undefined){
if(bi<0){
const entry={stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',_part:pid,dateAdded:submitTime,yourAnswer:S.ans[i]};
if(pid===1&&S._curPsg1){entry._passage=S._curPsg1;entry._psgLabel='P1 '+psgLabel}
if(pid===4&&S._curPsg4){entry._passage=S._curPsg4;entry._psgLabel='P4 '+psgLabel}
WB[pid].push(entry);added++;
}else{WB[pid][bi].yourAnswer=S.ans[i];WB[pid][bi].dateAdded=submitTime}
}
if(S.flags[i]){
const ui=UB[pid].findIndex(e=>qKey(e)===key);
if(ui<0){
const entry={stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',_part:pid,dateAdded:submitTime,yourAnswer:S.ans[i]};
if(pid===1&&S._curPsg1){entry._passage=S._curPsg1;entry._psgLabel='P1 '+psgLabel}
if(pid===4&&S._curPsg4){entry._passage=S._curPsg4;entry._psgLabel='P4 '+psgLabel}
UB[pid].push(entry);uncAdded++;
}
}
});
PC++;
HIST.push({
id:uid(),date:submitTime,part:S.part||0,mode:S.mode,
total:qs.length,correct:cor,time:S.tSec,
isFP:S.isFP,breakdown:S.isFP?breakdown:undefined,
passage1:S._curPsg1||'',passage4:S._curPsg4||'',
questions:qs.map(q=>({stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',_part:q._part})),
answers:{...S.ans}
});
const tw=Object.values(WB).reduce((a,b)=>a+b.length,0);
S._bu={a:added,r:removed,tw,u:uncAdded};
S.page='result';render();scrollTo(0,0);
toast(`Saved! +${added} wrong`);
}

function cpWrong(){
const qs=S.qs;
let txt=`📝 CRE English Wrong Qs · ${nowStr()}\n${'═'.repeat(30)}\n\n`;let n=0;
qs.forEach((q,i)=>{
if(S.ans[i]===undefined||S.ans[i]===q.answer)return;n++;
txt+=`❌ Q${i+1}${q._part?' [P'+q._part+']':''}\n`;
txt+=`${q.stem}\n\n`;
(q.options||[]).forEach((o,j)=>{txt+=`${j===q.answer?'✓':'　'}${optLabel(j)}. ${o}\n`});
txt+=`\n✗ You chose: ${optLabel(S.ans[i])}\n`;
if(q.explanation)txt+=`💡 ${q.explanation}\n`;
txt+=`\n${'─'.repeat(30)}\n\n`;
});
copyTxt(txt);toast(`Copied ${n} questions!`);
}

function doImport(){
const area=document.getElementById('impA'),msg=document.getElementById('impMsg');if(!area)return;
let raw=area.value.trim();if(!raw){sMsg(msg,'Please paste JSON.','r');return}
const cm=raw.match(/```(?:json)?\s*([\s\S]*?)```/);if(cm)raw=cm[1].trim();
let d;try{d=JSON.parse(raw)}catch(e){sMsg(msg,'JSON error: '+e.message,'r');return}
const impTime=nowStr();
if(d.fullPaper&&d.parts){
let tot=0;
for(let pid=1;pid<=4;pid++){const pqs=d.parts[String(pid)];if(!pqs||!Array.isArray(pqs))continue;pqs.forEach(q=>q._part=pid);CQ[pid]=pqs;IMP[pid]++;tot+=pqs.length;}
if(d.passage){PSG1=d.passage;PSG_HIST.push({text:d.passage,importedAt:impTime,label:'P1 Full '+impTime})}
if(d.passage4){PSG4=d.passage4;PSG_HIST.push({text:d.passage4,importedAt:impTime,label:'P4 Full '+impTime})}
IMP.full++;
sMsg(msg,`✓ Full paper imported! ${tot} questions`,'g');area.value='';toast('Import successful!');render();return;
}
if(!d.part||!d.questions){sMsg(msg,'Need "part"(1-4)+"questions", or "fullPaper":true+"parts".','r');return}
const pid=d.part;if(pid<1||pid>4){sMsg(msg,'part must be 1-4.','r');return}
d.questions.forEach(q=>q._part=pid);CQ[pid]=d.questions;
if(d.passage&&pid===1){PSG1=d.passage;PSG_HIST.push({text:d.passage,importedAt:impTime,label:'P1 '+impTime})}
if(d.passage&&pid===4){PSG4=d.passage;PSG_HIST.push({text:d.passage,importedAt:impTime,label:'P4 '+impTime})}
IMP[pid]++;
sMsg(msg,`✓ Part ${pid} imported: ${d.questions.length} questions!`,'g');area.value='';toast('Import successful!');
}
function sMsg(el,txt,c){if(!el)return;el.style.display='block';el.style.background=c==='r'?'var(--red-50)':'var(--green-50)';el.style.color=c==='r'?'var(--red-600)':'var(--green-600)';el.textContent=txt}

function buildSave(){
return{v:'1.2-USE',savedAt:nowStr(),wb:WB,ub:UB,hist:HIST,imp:IMP,pc:PC,cq:CQ,psg1:PSG1,psg4:PSG4,psgHist:PSG_HIST};
}
function doExport(){copyTxt(JSON.stringify(buildSave()));toast('Save copied! Paste to Notes for backup.')}
function doLoad(){
const area=document.getElementById('loadA');if(!area)return;
let raw=area.value.trim();if(!raw){toast('Please paste save data');return}
let d;try{d=JSON.parse(raw)}catch(e){toast('JSON error');return}
applyLoad(d);
const qCount=Object.values(CQ).reduce((a,b)=>a+b.length,0);
toast(`Loaded! ${HIST.length} records · ${qCount} questions`);area.value='';render();
}
function copyTxt(t){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).catch(()=>fbCopy(t));else fbCopy(t)}
function fbCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta)}

document.addEventListener('keydown',e=>{
if(S.page!=='quiz')return;
if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
const qs=S.qs;if(!qs)return;const q=qs[S.qi];if(!q)return;
const optCount=q.options?q.options.length:4;
if(e.key>='1'&&e.key<=String(optCount)){e.preventDefault();pickA(parseInt(e.key)-1)}
else if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();if(S.qi<qs.length-1){S.qi++;render();scrollTo(0,0)}}
else if(e.key==='ArrowLeft'){e.preventDefault();if(S.qi>0){S.qi--;render();scrollTo(0,0)}}
else if(e.key.toLowerCase()==='f'){e.preventDefault();S.flags[S.qi]=!S.flags[S.qi];render()}
});

render();
</script>
