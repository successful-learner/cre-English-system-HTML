<script>
// ===== MODAL =====
function showModal(title,msg,confirmText,onConfirm){
document.getElementById('modalTitle').textContent=title;
document.getElementById('modalMsg').textContent=msg;
const btn=document.getElementById('modalConfirm');
btn.textContent=confirmText||'Confirm';
btn.onclick=function(){closeModal();if(onConfirm)onConfirm();};
document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show');}

// ===== META =====
const OPT_LABELS='ABCDE';
const PARTS_META=[
{id:1,name:"Part 1 — Comprehension",desc:"Reading passage + inference",count:10,icon:"📖",optCount:4},
{id:2,name:"Part 2 — Error Identification",desc:"Find lexical/grammatical/stylistic errors",count:10,icon:"🔍",optCount:5},
{id:3,name:"Part 3 — Sentence Completion",desc:"Grammar-focused gap-fill",count:10,icon:"✍️",optCount:5},
{id:4,name:"Part 4 — Paragraph Improvement",desc:"Revise draft passages",count:10,icon:"📝",optCount:4}
];
const FULL_PAPER_COUNT=40;

// ===== PASSAGES =====
const PASSAGE_P1=`The notion that technology invariably leads to progress is one that has been largely unchallenged in public discourse for decades. From the industrial revolution onwards, each wave of innovation has been greeted with optimism, and those who expressed reservations were often dismissed as Luddites or reactionaries. Yet a more nuanced examination of the relationship between technological advancement and human wellbeing reveals a far more complex picture.\n\nConsider the impact of social media on democratic processes. While these platforms were initially celebrated as tools for democratisation — enabling citizens to organise, share information, and hold power to account — their capacity for spreading misinformation has proved equally formidable. The algorithms that determine what users see are designed not to inform but to engage, and outrage, it transpires, is considerably more engaging than nuance.\n\nThis is not to suggest that we should reject technological innovation wholesale. Rather, the argument is for a more deliberate and critical approach to adoption. The question should never be simply whether a new technology can be deployed, but whether it should be, and under what conditions. History offers numerous examples of innovations that were technically feasible but socially destructive — from leaded petrol to asbestos insulation.\n\nUltimately, the measure of any technology should be its contribution to human flourishing in its broadest sense. This requires that we move beyond simplistic metrics of economic growth or efficiency and consider the full spectrum of effects on social cohesion, mental health, equality of opportunity, and environmental sustainability. Technology, after all, is a means to an end, not an end in itself.`;

const PASSAGE_P4=`Passage A:\n\n(1) The city council has announced plans to convert three downtown parking lots into public green spaces. (2) The decision follows years of advocacy by environmental groups. (3) Having conducted extensive research into the benefits of urban greenery the council believes the investment will yield significant returns. (4) Studies show that access to green spaces reduces stress and promotes physical activity. (5) Property values near parks tend to increase by up to 20 percent. (6) However, some business owners have expressed concerns. (7) They worry that reduced parking will drive customers to suburban shopping centres. (8) The council has promised to address these concerns. (9) A new multi-storey car park will be built on the edge of the downtown area. (10) Shuttle buses will connect it to the main shopping streets.\n\n---\n\nPassage B:\n\n(1) Remote working has become increasingly common since the pandemic. (2) Many employees report higher job satisfaction when working from home. (3) Employers benefit from reduced overhead costs. (4) Despite these advantages, remote working is not without its challenges. (5) Some workers struggle with isolation and find it difficult to maintain boundaries between work and personal life. (6) Communication between team members can also suffer. (7) Misunderstandings that would be quickly resolved in person may escalate when conducted through email or messaging. (8) For this reason many organisations have adopted hybrid models. (9) Employees typically spend two or three days in the office and the remainder at home. (10) This approach attempts to balance flexibility with the benefits of face-to-face collaboration.`;

// ===== BUILT-IN QUESTIONS =====
const BUILTIN_QUESTIONS={
1:[

{stem:"According to the passage, social media platforms were initially celebrated because they:",options:["generated significant advertising revenue","enabled citizens to organise and share information","replaced traditional news outlets","were designed by democratic governments"],answer:1,explanation:"Paragraph 2: 'initially celebrated as tools for democratisation — enabling citizens to organise, share information'.",passage:true,_part:1},

function qKey(q){return(q.stem||'').substring(0,60)+'##'+(q.options?q.options[0]:'');}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400);}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5);}
function byteSize(o){return new Blob([JSON.stringify(o)]).size;}
function fmtB(b){return b<1024?b+'B':(b/1024).toFixed(1)+'KB';}
function optLabel(i){return OPT_LABELS[i]||String(i);}

function reviewItem(q,i,ua,ok){

let s='';if(j===q.answer)s='color:var(--green-600);font-weight:600';else if(j===ua&&!ok)s='color:var(--red-600);text-decoration:line-through';
h+=`<div style="${s}">${optLabel(j)}. ${esc(opt)}</div>`;
});

});

const qs=S.quizQs;let correct=0;qs.forEach((q,i)=>{if(S.answers[i]===q.answer)correct++;});
const pct=qs.length?Math.round(correct/qs.length*100):0;
const headerTitle=S.isFullPaper?'Full Paper Results':(PARTS_META.find(p=>p.id===S.currentPart)?.name||'Shuffle')+' Results';

if(S.isFullPaper){const bd=getBreakdown();h+=`<div class="breakdown">`;PARTS_META.forEach(p=>{h+=`<div class="breakdown-item"><div class="bd-label">P${p.id}</div><div class="bd-score">${bd[p.id]||0}/${bd['t'+p.id]||0}</div></div>`;});h+=`</div>`;}
h+=`<div class="dot-grid">`;qs.forEach((q,i)=>{const a=S.answers[i];const ok=a===q.answer;h+=`<div class="dot ${a!==undefined?(ok?'ok':'ng'):'skip'}">${i+1}</div>`;});
h+=`</div></div>`;
if(S._bankUpdate){const bu=S._bankUpdate;h+=`<div class="bank-update">✅ Wrong Bank: +${bu.added} new · ${bu.removed} mastered · ${bu.total} total</div>`;}
const wrongCount=qs.filter((q,i)=>S.answers[i]!==q.answer&&S.answers[i]!==undefined).length;
if(wrongCount>0)h+=`<button class="btn btn-danger mb-12" onclick="copyAllWrong()">📋 Copy All Wrong (${wrongCount} Qs)</button>`;
h+=`<div class="section-title">Question Review</div>`;
let lastPart=0;
qs.forEach((q,i)=>{
if(S.isFullPaper&&q._part&&q._part!==lastPart){lastPart=q._part;const pm=PARTS_META.find(p=>p.id===q._part);h+=`<div class="part-divider"><h4>${pm?pm.icon:''} ${pm?pm.name:''}</h4></div>`;}
const ua=S.answers[i];const ok=ua===q.answer;h+=reviewItem(q,i,ua,ok);
});
h+=`<button class="btn btn-primary mt-20" onclick="goHome()">Back to Home</button></div>`;

function getBreakdown(){const qs=S.quizQs;const bd={};PARTS_META.forEach(p=>{bd[p.id]=0;bd['t'+p.id]=0;});qs.forEach((q,i)=>{const pid=q._part||1;if(bd['t'+pid]!==undefined)bd['t'+pid]++;if(S.answers[i]===q.answer&&bd[pid]!==undefined)bd[pid]++;});return bd;}

// ===== ACTIONS =====
function setTab(t){S.tab=t;render();}
function goHome(){if(S._timerID){clearInterval(S._timerID);S._timerID=null;}S.timerOn=false;S.page='home';render();}
function confirmExit(){showModal('Leave Quiz','Leave now? Progress will not be saved.','Leave',goHome);}
function pickOpt(i){S.answers[S.currentQ]=i;render();}
function toggleRI(i){const el=document.getElementById('rb-'+i);if(el)el.classList.toggle('show');}
function viewRecord(id){S.viewingRecord=id;S.page='detail';render();window.scrollTo(0,0);}

function startQuiz(pid,mode){
let qs;
if(mode==='normal'){if(!currentQuestions[pid]||!currentQuestions[pid].length){toast('No questions');return;}qs=JSON.parse(JSON.stringify(currentQuestions[pid]));qs.forEach(q=>q._part=pid);}
else if(mode==='review'){if(!wrongBank[pid]||!wrongBank[pid].length){toast('No wrong questions');return;}qs=JSON.parse(JSON.stringify(wrongBank[pid]));qs.forEach(q=>q._part=pid);}
else{let all=[];Object.keys(wrongBank).forEach(k=>{wrongBank[k].forEach(q=>{all.push({...JSON.parse(JSON.stringify(q)),_part:parseInt(k)});});});if(!all.length){toast('No wrong questions');return;}for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}qs=all;}
S.page='quiz';S.currentPart=pid;S.currentQ=0;S.answers={};S.timerSec=0;S.timerOn=false;S.isFullPaper=false;
if(S._timerID){clearInterval(S._timerID);S._timerID=null;}S.passageOpen=true;S.quizMode=mode;S.quizQs=qs;S._bankUpdate=null;render();
}
function startFullPaper(){
let qs=[];for(let i=1;i<=4;i++){const pqs=JSON.parse(JSON.stringify(currentQuestions[i]||[]));pqs.forEach(q=>q._part=i);qs=qs.concat(pqs);}
if(!qs.length){toast('No questions');return;}
S.page='quiz';S.currentPart=0;S.currentQ=0;S.answers={};S.timerSec=0;S.timerOn=false;S.isFullPaper=true;
if(S._timerID){clearInterval(S._timerID);S._timerID=null;}S.passageOpen=true;S.quizMode='normal';S.quizQs=qs;S._bankUpdate=null;render();
}

function submitQuiz(){
if(S._timerID){clearInterval(S._timerID);S._timerID=null;}S.timerOn=false;
const qs=S.quizQs;let correct=0,added=0,removed=0;
const breakdown={};PARTS_META.forEach(p=>{breakdown[p.id]=0;});
qs.forEach((q,i)=>{
const pid=q._part||S.currentPart||1;if(pid<1||pid>4)return;
const key=qKey(q);const bIdx=wrongBank[pid].findIndex(e=>qKey(e)===key);
if(S.answers[i]===q.answer){correct++;if(breakdown[pid]!==undefined)breakdown[pid]++;if(bIdx>=0){wrongBank[pid].splice(bIdx,1);removed++;}}
else{if(S.answers[i]!==undefined){if(bIdx<0){wrongBank[pid].push({stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',passage:q.passage||false,dateAdded:today(),reviewCount:1,_part:pid});added++;}else{wrongBank[pid][bIdx].reviewCount=(wrongBank[pid][bIdx].reviewCount||0)+1;}}}
});
paperCount++;
const record={id:uid(),date:today(),part:S.currentPart||0,mode:S.quizMode,total:qs.length,correct,time:S.timerSec,isFullPaper:S.isFullPaper,paperNum:S.isFullPaper?paperCount:undefined,breakdown:S.isFullPaper?breakdown:undefined,questions:qs.map(q=>({stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',_part:q._part})),answers:{...S.answers}};
quizHistory.push(record);
const tw=Object.values(wrongBank).reduce((s,a)=>s+a.length,0);
S._bankUpdate={added,removed,total:tw};S.page='result';render();window.scrollTo(0,0);
toast(`+${added} wrong · ${removed} mastered`);
}

function copyAllWrong(){
const qs=S.quizQs;let txt='=== Wrong Questions ===\n';txt+=`Date: ${today()}\n\n`;let n=0;
qs.forEach((q,i)=>{if(S.answers[i]===undefined||S.answers[i]===q.answer)return;n++;
txt+=`[Q${i+1}]${q._part?' (Part '+q._part+')':''}\n`;txt+=`${q.stem}\n`;
(q.options||[]).forEach((o,j)=>{txt+=`  ${optLabel(j)}. ${o}\n`;});
txt+=`Your answer: ${optLabel(S.answers[i])}\nCorrect: ${optLabel(q.answer)}\n`;
if(q.explanation)txt+=`Explanation: ${q.explanation}\n`;txt+=`${'─'.repeat(30)}\n\n`;});
copyTxt(txt,`Copied ${n} wrong questions!`);
}

// ===== IMPORT =====
function doImport(){
const area=document.getElementById('importArea');const msg=document.getElementById('importMsg');if(!area)return;
let raw=area.value.trim();if(!raw){showMsg(msg,'Please paste JSON.','red');return;}
const cm=raw.match(/```(?:json)?\s*([\s\S]*?)```/);if(cm)raw=cm[1].trim();
let data;try{data=JSON.parse(raw);}catch(e){showMsg(msg,'JSON parse error: '+e.message,'red');return;}
if(data.fullPaper&&data.parts){
let totalImported=0,errors=[];
for(let pid=1;pid<=4;pid++){
const pqs=data.parts[String(pid)];if(!pqs||!Array.isArray(pqs)){errors.push(`Part ${pid} missing`);continue;}
let valid=true;pqs.forEach(q=>{if(!q.stem||!q.options||q.options.length<4||q.answer===undefined)valid=false;});
if(!valid){errors.push(`Part ${pid} format error`);continue;}
pqs.forEach(q=>q._part=pid);currentQuestions[pid]=pqs;importedSets[pid]=(importedSets[pid]||0)+1;totalImported+=pqs.length;
}
if(data.passage)currentPassage1=data.passage;
if(data.passage4)currentPassage4=data.passage4;
importedSets.full=(importedSets.full||0)+1;
if(errors.length)showMsg(msg,`⚠️ Partial: ${totalImported} Qs imported. Issues: ${errors.join(', ')}`,'red');
else showMsg(msg,`✓ Full paper imported! ${totalImported} questions (all 4 Parts updated)`,'green');
area.value='';toast('Full paper imported!');render();return;
}
if(!data.part||!data.questions||!Array.isArray(data.questions)){showMsg(msg,'Need "part"(1-4)+"questions", or "fullPaper":true+"parts".','red');return;}
const pid=data.part;if(pid<1||pid>4){showMsg(msg,'part must be 1-4.','red');return;}
let valid=true;data.questions.forEach(q=>{if(!q.stem||!q.options||q.options.length<4||q.answer===undefined)valid=false;});
if(!valid){showMsg(msg,'Question format error.','red');return;}
data.questions.forEach(q=>q._part=pid);currentQuestions[pid]=data.questions;
if(data.passage&&pid===1)currentPassage1=data.passage;
if(data.passage&&pid===4)currentPassage4=data.passage;
importedSets[pid]=(importedSets[pid]||0)+1;
showMsg(msg,`✓ Part ${pid} imported: ${data.questions.length} questions!`,'green');
area.value='';toast('Import successful!');
}
function showMsg(el,txt,color){if(!el)return;el.style.display='block';el.style.background=color==='red'?'var(--red-50)':'var(--green-50)';el.style.color=color==='red'?'var(--red-700)':'var(--green-700)';el.textContent=txt;}

// ===== SAVE/LOAD =====
function buildSave(mode){
if(mode==='compact'){return{version:'1.0-USE',exportDate:today(),wrongBank,history:quizHistory.map(r=>({id:r.id,date:r.date,part:r.part,mode:r.mode,total:r.total,correct:r.correct,time:r.time,isFullPaper:r.isFullPaper,paperNum:r.paperNum,breakdown:r.breakdown})),importedSets,paperCount};}
return{version:'1.0-USE',exportDate:today(),wrongBank,history:quizHistory,importedSets,paperCount,currentQuestions,currentPassage1,currentPassage4};
}
function doExport(){
const radios=document.querySelectorAll('input[name="saveMode"]');let mode='compact';radios.forEach(r=>{if(r.checked)mode=r.value;});
const json=JSON.stringify(buildSave(mode));const area=document.getElementById('exportArea');if(area)area.value=json;
copyTxt(json,`${mode==='full'?'Full':'Compact'} save copied!`);
}
function doLoad(){
const area=document.getElementById('loadArea');const msg=document.getElementById('loadMsg');if(!area)return;
let raw=area.value.trim();if(!raw){showMsg(msg,'Please paste save data.','red');return;}
let data;try{data=JSON.parse(raw);}catch(e){showMsg(msg,'JSON error: '+e.message,'red');return;}
if(!data.wrongBank&&!data.history){showMsg(msg,'Not a valid save file.','red');return;}
if(data.wrongBank)wrongBank=data.wrongBank;
if(data.history)quizHistory=data.history;
if(data.currentQuestions)currentQuestions=data.currentQuestions;
if(data.currentPassage1)currentPassage1=data.currentPassage1;
if(data.currentPassage4)currentPassage4=data.currentPassage4;
if(data.importedSets)importedSets=data.importedSets;
if(data.paperCount)paperCount=data.paperCount;
const tw=Object.values(wrongBank).reduce((s,a)=>s+a.length,0);
showMsg(msg,`✓ Restored! Wrong bank: ${tw} · History: ${quizHistory.length}`,'green');
area.value='';toast('Load successful!');setTimeout(render,500);
}

// ===== COPY =====
function copyTxt(t,m){
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast(m||'Copied')).catch(()=>fbCopy(t,m));
else fbCopy(t,m);
}
function fbCopy(t,m){const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast(m||'Copied');}

// ===== INIT =====
render();
</script>
